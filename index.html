<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="card">
    <h2>Secure Key Vault</h2>
    <p class="subtitle">Generate strong, custom passwords</p>

    <div class="display-box">
      <input type="text" id="password" readonly placeholder="Your password here..." />
      <button id="copyBtn" type="button" title="Copy">
        📋
      </button>
    </div>

    <div class="controls">
      <div class="slider-row">
        <label for="length">Password Length:</label>
        <span id="lengthVal">12</span>
      </div>
      <input type="range" id="length" min="6" max="32" value="12" />

      <div class="checkbox-grid">
        <label><input type="checkbox" id="uppercase" checked /> Uppercase (A-Z)</label>
        <label><input type="checkbox" id="lowercase" checked /> Lowercase (a-z)</label>
        <label><input type="checkbox" id="numbers" checked /> Numbers (0-9)</label>
        <label><input type="checkbox" id="symbols" checked /> Symbols (!@#$)</label>
      </div>
    </div>

    <button id="generateBtn" type="button" class="primary-btn">Generate Password</button>
    <div id="toast">Copied to clipboard!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
